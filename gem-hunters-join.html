<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gem Hunters Join</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: Inter, Arial, sans-serif;
    }

    .ghw {
      width: 100%;
      max-width: 695px;
      margin: 0 auto;
      aspect-ratio: 695 / 426;
      display: block;
      text-decoration: none;
      color: #fff;
      border-radius: 24px;
      outline: 0;
    }

    .ghw-card {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 280px;
      overflow: hidden;
      border-radius: 24px;
      background:
        radial-gradient(847px 928px at 137% -87%, rgba(126, 222, 251, .10), transparent 62%),
        linear-gradient(135deg, #102a40 0%, #0e263a 100%);
      box-shadow: 0 4px 4px rgba(0, 0, 0, .25);
      isolation: isolate;
    }

    .ghw-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      opacity: .42;
      background-image:
        linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 4px 4px;
    }

    .ghw-card::after {
      content: "\2197";
      position: absolute;
      right: 48px;
      top: -42px;
      z-index: -1;
      color: rgba(255, 255, 255, .045);
      font-size: clamp(170px, 38vw, 270px);
      line-height: .8;
      font-weight: 900;
      transform: rotate(-8deg);
    }

    .ghw-title-box {
      position: absolute;
      left: 20px;
      top: 23px;
      width: calc(100% - 37px);
      height: 125px;
      border: 1px solid rgba(131, 143, 251, .20);
      border-radius: 24px;
    }

    .ghw-title {
      position: absolute;
      left: 41px;
      top: 34px;
      width: min(606px, calc(100% - 82px));
      margin: 0;
      color: #fff;
      font-size: clamp(32px, 6.48vw, 45px);
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0;
    }

    .ghw-label {
      position: absolute;
      left: 24px;
      top: 175px;
      width: 288px;
      display: flex;
      gap: 9px;
      align-items: flex-start;
      color: #fff;
      font-size: clamp(17px, 3.16vw, 22px);
      line-height: 1.23;
      font-weight: 700;
    }

    .ghw-price-box {
      position: absolute;
      left: 20px;
      top: 197px;
      width: calc(100% - 37px);
      height: 156px;
      border: 1px solid rgba(131, 143, 251, .50);
      border-radius: 24px;
      background: rgba(131, 143, 251, .06);
    }

    .ghw-plans {
      position: absolute;
      left: 50%;
      top: 245px;
      width: min(466px, calc(100% - 64px));
      height: 92px;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .ghw-plan {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      padding: 12px 4px;
      border: 1px solid rgba(131, 143, 251, .30);
      border-radius: 16px;
      background: rgba(131, 143, 251, .05);
    }

    .ghw-price {
      color: #fff;
      font-size: clamp(29px, 5.47vw, 38px);
      line-height: 1.05;
      font-weight: 800;
      white-space: nowrap;
    }

    .ghw-period {
      margin-top: 5px;
      color: #fff;
      font-size: clamp(14px, 2.59vw, 18px);
      line-height: 1.2;
      font-weight: 500;
      white-space: nowrap;
    }

    .ghw-cta {
      position: absolute;
      left: 19px;
      right: 18px;
      bottom: 6px;
      height: 59px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(131, 143, 251, .50);
      border-radius: 16px;
      background: rgba(131, 143, 251, .15);
      color: #fff;
      font-size: clamp(24px, 5.47vw, 38px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: .05em;
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
    }

    .ghw:hover .ghw-cta,
    .ghw:focus-visible .ghw-cta {
      transform: translateY(-1px);
      border-color: rgba(154, 166, 255, .72);
      background: rgba(131, 143, 251, .22);
    }

    .ghw:focus-visible {
      box-shadow: 0 0 0 3px rgba(131, 143, 251, .45);
    }

    @media (max-width: 520px) {
      .ghw {
        aspect-ratio: auto;
        height: 512px;
      }

      .ghw-title-box {
        left: 12px;
        top: 12px;
        width: calc(100% - 24px);
        height: 126px;
        border-radius: 20px;
      }

      .ghw-title {
        left: 28px;
        top: 29px;
        width: calc(100% - 56px);
        font-size: 32px;
        line-height: 1.12;
      }

      .ghw-label {
        left: 24px;
        top: 164px;
        width: calc(100% - 48px);
        font-size: 19px;
      }

      .ghw-price-box {
        left: 12px;
        top: 210px;
        width: calc(100% - 24px);
        height: 229px;
        border-radius: 20px;
      }

      .ghw-plans {
        top: 228px;
        width: calc(100% - 48px);
        height: 192px;
        grid-template-columns: 1fr;
      }

      .ghw-plan {
        min-height: 58px;
        padding: 8px 4px;
      }

      .ghw-price {
        font-size: 34px;
      }

      .ghw-period {
        font-size: 15px;
      }

      .ghw-cta {
        left: 12px;
        right: 12px;
        bottom: 12px;
        height: 48px;
        font-size: 24px;
        border-radius: 14px;
      }
    }
  </style>
</head>
<body>
  <a class="ghw" href="https://t.me/PayGemHuntersBot" target="_blank" rel="noopener noreferrer" aria-label="Вступить в Gem Hunters">
    <section class="ghw-card">
      <div class="ghw-title-box"></div>
      <h1 class="ghw-title">Как присоединиться к Gem Hunters?</h1>

      <div class="ghw-price-box"></div>
      <div class="ghw-label"><span aria-hidden="true">💵</span><span>Стоимость подписки на данный момент</span></div>

      <div class="ghw-plans" aria-label="Стоимость подписки">
        <div class="ghw-plan">
          <div class="ghw-price">$99</div>
          <div class="ghw-period">1 месяц</div>
        </div>
        <div class="ghw-plan">
          <div class="ghw-price">$279</div>
          <div class="ghw-period">3 месяца</div>
        </div>
        <div class="ghw-plan">
          <div class="ghw-price">$529</div>
          <div class="ghw-period">6 месяцев</div>
        </div>
      </div>

      <div class="ghw-cta">ВСТУПИТЬ</div>
    </section>
  </a>
</body>
</html>
