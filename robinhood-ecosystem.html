<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robinhood Chain ecosystem</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  html,body{margin:0;background:transparent}
  body{padding:0}
  #ecw{--bg:#ffffff;--soft:#fafafb;--text:#14151a;--body:#3b4049;--muted:#8b8f99;--line:#e8e8ed;--accent:#6c42eb;--accent-soft:#6c42eb14;--badge:#141519;
    font-family:'Geist',system-ui,sans-serif;color:var(--body);background:var(--bg);border:1px solid var(--line);width:100%;max-width:none;margin:0 auto;line-height:1.5}
  #ecw *{box-sizing:border-box;min-width:0}
  #ecw .hd{padding:22px 26px 16px;border-bottom:1px solid var(--line)}
  #ecw .kick{font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  #ecw h2{margin:11px 0 8px;font:700 25px/1.13 'Geist',system-ui,sans-serif;letter-spacing:-.025em;color:var(--text)}
  #ecw .sub{margin:0;color:var(--muted);font-size:13.5px;max-width:62ch}
  #ecw .tools{padding:16px 26px 6px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  #ecw .search{flex:1;min-width:150px}
  #ecw .search input{width:100%;font:400 13px 'Geist',system-ui,sans-serif;padding:8px 12px;border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none}
  #ecw .search input:focus{border-color:var(--accent)}
  #ecw .filters{padding:8px 26px 4px;display:flex;gap:7px;flex-wrap:wrap}
  #ecw .filters button{font:500 12px 'Geist',system-ui,sans-serif;padding:6px 12px;border:1px solid var(--line);background:var(--bg);color:var(--body);cursor:pointer;transition:.15s;white-space:nowrap}
  #ecw .filters button:hover{border-color:var(--accent);color:var(--accent)}
  #ecw .filters button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  #ecw .filters button .c{font:600 11px 'IBM Plex Mono',monospace;opacity:.7;margin-left:5px}
  #ecw .note{padding:2px 26px 0;font-size:11.5px;color:var(--muted)}
  #ecw .grid{padding:16px 24px 16px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px 8px;height:865px;overflow-y:auto;align-content:start;overscroll-behavior:contain}
  #ecw .grid::-webkit-scrollbar{width:7px}
  #ecw .grid::-webkit-scrollbar-track{background:transparent}
  #ecw .grid::-webkit-scrollbar-thumb{background:#d8d8e2;border-radius:999px}
  #ecw a.cell{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;text-decoration:none;padding:4px 2px;transition:.12s}
  #ecw a.cell .badge{width:52px;height:52px;border-radius:50%;background:var(--badge);display:flex;align-items:center;justify-content:center;transition:.15s;position:relative}
  #ecw a.cell .badge img{width:30px;height:30px;object-fit:contain}
  #ecw a.cell.star .badge{box-shadow:0 0 0 2px var(--accent)}
  #ecw a.cell:hover .badge{transform:translateY(-2px)}
  #ecw a.cell .nm{font:600 12px 'Geist',system-ui,sans-serif;color:var(--text);line-height:1.25}
  #ecw a.cell:hover .nm{color:var(--accent)}
  #ecw a.cell .ct{font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  #ecw a.cell.star .ct{color:var(--accent)}
  #ecw .ft{margin-top:10px;padding:12px 26px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  @media(max-width:620px){#ecw .grid{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:440px){#ecw .grid{grid-template-columns:repeat(3,1fr)}#ecw .hd,#ecw .tools,#ecw .filters,#ecw .grid,#ecw .ft,#ecw .note{padding-left:16px;padding-right:16px}}
</style>
</head>

    grid.innerHTML='';
    list.forEach(d=>{
